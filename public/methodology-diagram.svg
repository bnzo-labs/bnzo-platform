<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="640" fill="#0C0C0C"/>
  <text x="60" y="60" fill="#6B6868" font-size="11" letter-spacing="2"
