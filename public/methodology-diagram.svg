    <rect x="285" y="258" width="180" height="40" rx="4" fill="none" stroke="#6B6868"/>
    <text x="375" y="283" fill="#6B6868" font-size="13" text-anchor="middle"
          font-family="ui-monospace, monospace">Design</text>
    <rect x="510" y="258" width="180" height="40" rx="4" fill="none" stroke="#6B6868"/>
    <text x="600" y="283" fill="#6B6868" font-size="13" text-anchor="middle"
